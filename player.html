<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Jogador</title>
<style>
body{
  font-family:Segoe UI;
  max-width:800px;
  margin:auto;
  padding:20px;
}
button{
  padding:10px;
}
</style>
</head>

<body>

<h1>🎮 Jogador</h1>

<p>Sessão: <span id="session"></span></p>

<input id="name" placeholder="Nome">

<button onclick="join()">Entrar</button>

<div id="game"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyB_ktbkHUHZcO8Q21BDCBxcB_Hjwk27zWQ",
  authDomain: "tikiti-roiau.firebaseapp.com",
  projectId: "tikiti-roiau",
  storageBucket: "tikiti-roiau.firebasestorage.app",
  messagingSenderId: "297279976355",
  appId: "1:297279976355:web:1fe01b6b2636ee43dee016"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const session =
new URLSearchParams(location.search)
.get("session") || "-";

document.getElementById("session").innerText =
session;

window.join = async function(){

 const name =
 document.getElementById("name").value.trim();

 if(!name){
   alert("Indica o teu nome");
   return;
 }

 const playerId =
 crypto.randomUUID();

 await setDoc(
   doc(
     db,
     "sessions",
     session,
     "players",
     playerId
   ),
   {
     name: name,
     hits: 0,
     winner: false,
     joinedAt: new Date().toISOString()
   }
 );

 document.getElementById("game").innerHTML = `
   <h2>✅ Bem-vindo ${name}</h2>
   <p>Registado na sessão ${session}</p>
 `;
}

</script>


</body>
</html>
