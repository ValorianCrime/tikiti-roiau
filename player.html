<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Jogador</title>
<style>
body{
  font-family:Segoe UI;
  max-width:800px;
  margin:auto;
  padding:20px;
}
button{
  padding:10px;
}
</style>
</head>

<body>

<h1>🎮 Jogador</h1>

<p>Sessão: <span id="session"></span></p>

<input id="name" placeholder="Nome">

<button onclick="join()">Entrar</button>

<div id="game"></div>

<div id="words"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import { WORDS } from "./js/words.js";


const firebaseConfig = {

  apiKey: "AIzaSyB_ktbkHUHZcO8Q21BDCBxcB_Hjwk27zWQ",
  authDomain: "tikiti-roiau.firebaseapp.com",
  projectId: "tikiti-roiau",
  storageBucket: "tikiti-roiau.firebasestorage.app",
  messagingSenderId: "297279976355",
  appId: "1:297279976355:web:1fe01b6b2636ee43dee016"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let picks = [];

const session =
new URLSearchParams(location.search)
.get("session") || "-";

document.getElementById("session").innerText =
session;

window.join = async function(){
picks = [];

const name =
 document.getElementById("name").value.trim();

window.playerName = name;

 if(!name){
   alert("Indica o teu nome");
   return;
 }
 const playersSnapshot =
    await getDocs(
        collection(
            db,
            "sessions",
            session,
            "players"
        )
    );

let duplicate = false;

playersSnapshot.forEach(player => {

    const existingName =
        player.data().name;

    if (
        existingName.toLowerCase()
        ===
        name.toLowerCase()
    ) {
        duplicate = true;
    }

});

if (duplicate) {

    alert(
        "Já existe um jogador com esse nome nesta sessão."
    );

    return;
}

const playerId = crypto.randomUUID();
window.playerId = playerId;

 await setDoc(
   doc(
     db,
     "sessions",
     session,
     "players",
     playerId
   ),
   {
     name: name,
     hits: 0,
     winner: false,
     joinedAt: new Date().toISOString()
   }
 );

 document.getElementById("game").innerHTML = `
   <h2>✅ Bem-vindo ${name}</h2>
   <p>Registado na sessão ${session}</p>
 `;

const selected =
    [...WORDS]
        .sort(() => Math.random() - 0.5)
        .slice(0, 9);

const wordsDiv =
    document.getElementById("words");

wordsDiv.innerHTML =
    "<h2>Escolhe 3 palavras</h2>";

selected.forEach(word => {

    const button =
        document.createElement("button");

    button.textContent = word;

    button.style.margin = "5px";

    button.onclick = async () => {

        if (button.classList.contains("selected")) {
            return;
        }

        if (picks.length >= 3) {
            return;
        }

        picks.push(word);
        button.classList.add("selected");


        button.style.background = "#0078d4";
        button.style.color = "white";

        if (picks.length === 3) {

            document.querySelectorAll("#words button")
                .forEach(b => b.disabled = true);

            await setDoc(
                doc(
                    db,
                    "sessions",
                    session,
                    "players",
                    playerId
                ),
                {
                    name,
                    hits: 0,
                    winner: false,
                    joinedAt: new Date().toISOString(),
                    picks
                }
            );

            wordsDiv.innerHTML += `
                <h3>🔒 Aposta registada</h3>
                <p>${picks.join(" • ")}</p>
            `;
        }
    };

    wordsDiv.appendChild(button);
});
}

</script>


</body>
</html>
