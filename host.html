<h1>👑 Painel do Anfitrião</h1>

<button onclick="createSession()">

Criar Sessão

</button>

<h2 id="sessionCode"></h2>

<canvas id="qr"></canvas>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script type="module">

import {
 initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 doc,
 setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "AIzaSyB_ktbkHUHZcO8Q21BDCBxcB_Hjwk27zWQ",
 authDomain: "tikiti-roiau.firebaseapp.com",
 projectId: "tikiti-roiau",
 storageBucket: "tikiti-roiau.firebasestorage.app",
 messagingSenderId: "297279976355",
 appId: "1:297279976355:web:1fe01b6b2636ee43dee016"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.createSession = async function(){

 const code =
 Math.random()
 .toString(36)
 .substring(2,8)
 .toUpperCase();

 await setDoc(
   doc(db,"sessions",code),
   {
     status:"waiting",
     createdAt:new Date().toISOString()
   }
 );

 document.getElementById("sessionCode").innerText =
 "Sessão: " + code;

 const playerUrl =
 location.origin +
 location.pathname.replace(
 "host.html",
 "player.html"
 ) +
 "?session=" +
 code;

 QRCode.toCanvas(
   document.getElementById("qr"),
   playerUrl
 );
}

</script>
