<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <title>👑 Tikiti Roiau - Host</title>

    https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #sessionCode {
            margin-top: 20px;
        }

        #qr {
            margin-top: 20px;
        }

        #players {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>👑 Painel do Anfitrião</h1>

    <button onclick="createSession()">
        Criar Sessão
    </button>

    <h2 id="sessionCode"></h2>

    <canvas id="qr"></canvas>

    <h2>Jogadores</h2>

    <ul id="players"></ul>

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            setDoc,
            collection,
            onSnapshot
        }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_ktbkHUHZcO8Q21BDCBxcB_Hjwk27zWQ",
            authDomain: "tikiti-roiau.firebaseapp.com",
            projectId: "tikiti-roiau",
            storageBucket: "tikiti-roiau.firebasestorage.app",
            messagingSenderId: "297279976355",
            appId: "1:297279976355:web:1fe01b6b2636ee43dee016"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.createSession = async function () {

            const code =
                Math.random()
                    .toString(36)
                    .substring(2, 8)
                    .toUpperCase();

            await setDoc(
                doc(db, "sessions", code),
                {
                    status: "waiting",
                    createdAt: new Date().toISOString()
                }
            );

            document.getElementById("sessionCode").innerText =
                "Sessão: " + code;

            const playerUrl =
                location.origin +
                location.pathname.replace(
                    "host.html",
                    "player.html"
                ) +
                "?session=" +
                code;

            QRCode.toCanvas(
                document.getElementById("qr"),
                playerUrl
            );

            const playersRef =
                collection(
                    db,
                    "sessions",
                    code,
                    "players"
                );

            onSnapshot(playersRef, (snapshot) => {

                const ul =
                    document.getElementById("players");

                ul.innerHTML = "";

                snapshot.forEach((player) => {

                    const li =
                        document.createElement("li");

                    li.textContent =
                        player.data().name;

                    ul.appendChild(li);

                });

            });

        };

    </script>

</body>

</html>
