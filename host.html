<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script></head><body><h1>Painel do Anfitrião</h1><p>Código da sessão: <span id="code"></span></p><canvas id="q"></canvas><ul id="words"></ul><script>const code=Math.random().toString(36).substring(2,8).toUpperCase();document.getElementById('code').textContent=code;const url=location.origin+location.pathname.replace('host.html','player.html')+'?session='+code;QRCode.toCanvas(document.getElementById('q'),url);['Tikiti','Outiluqui','Upigraidi'].forEach(w=>{let li=document.createElement('li');li.textContent='Chamar: '+w;words.appendChild(li);});</script></body></html>
